[tox]
minversion = 3.8.0
envlist = py312, py313, ruff, mypy
isolated_build = true

[gh-actions]
python =
    3.12: py312, mypy, ruff
    3.13: py313

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    pytest
    pytest-cov
commands_pre =
    python -c "import os; import shutil; f = '.env'; s = '.env.example'; (not os.path.exists(f)) and shutil.copyfile(s, f)"
commands =
    pytest --basetemp={envtmpdir}
# Optional cleanup:
commands_post =
    python -c "import os; os.remove('.env') if os.path.exists('.env') else None"


[testenv:ruff]
basepython = python3.12
deps = 
    ruff
commands = ruff check src tests --exit-zero

[testenv:mypy]
basepython = python3.12
deps =
    mypy
commands = 
    - mypy src # - is for ignoring exit code
