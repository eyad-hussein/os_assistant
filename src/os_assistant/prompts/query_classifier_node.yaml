# OS Configuration - Edit these values to switch OS context
# OS_NAME: Windows (or Linux)
# PRIMARY_PATH: D:\Graduation_Project_Test_Environment (or /home/user/projects)
# FOLDER_NAME: folder (or directory)
# SHELL_TYPE: PowerShell/CMD (or shell script)
# TERMINAL_TYPE: Command Prompt (or terminal)
# FILESYSTEM_TERM: file system structure (or filesystem hierarchy)

prompt: |
  Classify this Windows query: '{prompt}' as either 'command' or 'information'.

  Context from relevant domains:
  {combined_context}

  IMPORTANT: The context above comes from RAG retrieval and may not always be directly relevant. Analyze it carefully and determine if it provides useful information for this specific query.

  Primary System Path: D:\Graduation_Project_Test_Environment
  Any file paths in your response should be related to this Windows environment.

  Classification Guidelines:
  - 'command': User wants to perform an action, execute a Windows command, PowerShell/CMD, or use Command Prompt. Examples include:
    * "How do I delete all .tmp files in my Downloads folder?"
    * "Create a new folder called 'Projects'"
    * "Move all .jpg files from Pictures to Backup"
    * "Change permissions on this file"
  
  - 'information': User wants facts, explanations, or understanding about their Windows system. Examples include:
    * "What is the Windows file system structure?"
    * "How much disk space do I have left?"
    * "What are environment variables?"
    * "Why is my system running slowly?"

  If the query could be interpreted either way, consider the user's likely intent. If they're asking "how to" do something specific, it's likely a command request.

  Provide detailed reasoning for your classification choice.

  IMPORTANT: Your response MUST be ONLY a valid JSON object conforming to the specified format.
  Do NOT include any introductory text, explanations, apologies, or any characters before the opening '{{' or after the closing '}}'.

  JSON Format:
  {format_instructions}
