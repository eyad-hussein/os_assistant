# OS Configuration - Edit these values to switch OS context
# OS_NAME: Windows (or Linux)
# PRIMARY_PATH: D:\Graduation_Project_Test_Environment (or /home/user/projects)
# FILE_COMMANDS: dir, copy, move, del, Get-ChildItem, Select-String, icacls, takeown, Get-Volume, Get-ChildItem (or ls, cp, mv, rm, find, grep, chmod, chown, df, du)
# USER_COMMANDS: New-LocalUser, Set-LocalUser, net user, Get-LocalGroup, runas (or useradd, usermod, passwd, groups, sudo)
# PACKAGE_SYSTEM: Windows Store, MSI, DISM, Get-AppxPackage (or apt, yum, dnf, pacman)
# NETWORK_COMMANDS: ipconfig, Get-NetAdapter, netstat, RDP, ping (or ifconfig, ip, netstat, ssh, ping)

prompt: |
  Analyze this Windows query: '{prompt}' and identify the most relevant domains from: {domains}.

  Primary System Path: D:\Graduation_Project_Test_Environment
  Any analysis should consider that the user is working within a Windows environment.

  Guidelines:
  1. Consider that queries may relate to multiple domains.
  2. Focus on the primary intent of the query.
  3. Include only truly relevant domains.
  4. Provide detailed reasoning.

  Domains overview for Windows:
  - file_system: File operations, folders, permissions, storage, Windows Explorer, file search, file attributes, disk space, file types, paths, file sharing, file compression, disk management, backup, and restore. Includes commands like dir, copy, move, del, Get-ChildItem, Select-String, icacls, takeown, Get-Volume.
  
  - users: User accounts, passwords, authentication, user groups, Windows security, user profiles, access control, permissions, security policies, login settings, account types, password policies, User Account Control (UAC), and privilege levels. Includes commands like New-LocalUser, Set-LocalUser, net user, Get-LocalGroup, runas.
  
  - packages: Software installation, updates, Windows package management, Microsoft Store, application deployment, software updates, Windows Update, app uninstallation, program compatibility, MSI packages, application settings, Windows features, and optional components.
  
  - networking: Windows connectivity, IP configuration, network adapters, sharing, firewall settings, network discovery, Wi-Fi settings, VPN, remote desktop, proxy settings, internet settings, network troubleshooting, network drives, and network security. Includes commands like ipconfig, Get-NetAdapter, netstat, RDP, ping.

  Examples:
  - "How do I check disk space?" → file_system
  - "How to create a new user account?" → users
  - "Can I install Office offline?" → packages
  - "Why can't I connect to my home network?" → networking
  - "How to backup my Documents folder?" → file_system
  - "How to share files between users?" → [file_system, users]

  IMPORTANT: Your response MUST be ONLY a valid JSON object conforming to the specified format.
  Do NOT include any introductory text, explanations, apologies, or any characters before the opening '{{' or after the closing '}}'.

  JSON Format:
  {format_instructions}
