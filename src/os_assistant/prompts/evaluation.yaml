
# General evaluation prompt (fallback)
general_evaluation_prompt: |
  You are an expert evaluator for operating system assistants. Your task is to evaluate the quality of an OS Assistant's response.
  
  QUESTION: {question}
  
  EXPECTED RESPONSE:
  {expected_response}
  
  ACTUAL RESPONSE:
  {actual_response}
  
  QUERY TYPE: {query_type}
  
  Evaluate the actual response against the expected response using these criteria:
  1. Correctness (1-5): Is the response factually correct?
  2. Completeness (1-5): Does it address all aspects of the question?
  3. Relevance (1-5): Is the information provided relevant to the query?
  4. Clarity (1-5): Is the explanation clear and understandable?
  
  Your response must be a valid JSON object with the following structure:
  ```
  {{
    "scores": {{
      "correctness": [score from 1-5],
      "completeness": [score from 1-5],
      "relevance": [score from 1-5],
      "clarity": [score from 1-5]
    }},
    "overall_score": [average of all scores, rounded to 2 decimal places],
    "reasoning": [your explanation of the scores]
  }}
  ```
  
  IMPORTANT: Return ONLY the JSON object, no other text.

# Command-specific evaluation prompt
command_evaluation_prompt: |
  You are an expert evaluator for operating system assistants. Your task is to evaluate the quality of an OS Assistant's command response.
  
  QUESTION: {question}
  
  EXPECTED RESPONSE:
  {expected_response}
  
  ACTUAL RESPONSE:
  {actual_response}
  
  Evaluate the command response using these specific criteria:
  1. Command Correctness (1-5): Would the command achieve the desired outcome?
  2. Command Efficiency (1-5): Is the command efficient with appropriate flags/options?
  3. Safety Considerations (1-5): Does it include necessary precautions and avoid dangerous operations?
  4. Explanation Quality (1-5): Is the explanation clear, accurate, and helpful?
  
  Your response must be a valid JSON object with the following structure:
  ```
  {{
    "scores": {{
      "command_correctness": [score from 1-5],
      "command_efficiency": [score from 1-5],
      "safety_considerations": [score from 1-5],
      "explanation_quality": [score from 1-5]
    }},
    "overall_score": [average of all scores, rounded to 2 decimal places],
    "reasoning": [your explanation of the scores]
  }}
  ```
  
  IMPORTANT: Return ONLY the JSON object, no other text.

# Information-specific evaluation prompt
information_evaluation_prompt: |
  You are an expert evaluator for operating system assistants. Your task is to evaluate the quality of an OS Assistant's information response.
  
  QUESTION: {question}
  
  EXPECTED RESPONSE:
  {expected_response}
  
  ACTUAL RESPONSE:
  {actual_response}
  
  Evaluate the information response using these specific criteria:
  1. Factual Accuracy (1-5): Is the information factually correct?
  2. Completeness (1-5): Does it cover all aspects of the question?
  3. Relevance (1-5): Is the information directly relevant to the query?
  4. Clarity (1-5): Is the explanation clear and easy to understand?
  
  Your response must be a valid JSON object with the following structure:
  ```
  {{
    "scores": {{
      "factual_accuracy": [score from 1-5],
      "completeness": [score from 1-5],
      "relevance": [score from 1-5],
      "clarity": [score from 1-5]
    }},
    "overall_score": [average of all scores, rounded to 2 decimal places],
    "reasoning": [your explanation of the scores]
  }}
  ```
  
  IMPORTANT: Return ONLY the JSON object, no other text.
