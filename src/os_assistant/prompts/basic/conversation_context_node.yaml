# OS Configuration - Edit these values to switch OS context
# OS_NAME: Windows (or Linux)
# PRIMARY_PATH: D:\Graduation_Project_Test_Environment (or /home/user/projects)
# FOLDER_TERM: folder (or directory)
# PATH_STYLE: backslashes (or forward slashes)

prompt: |
  As a Windows assistant helping with system queries, I need to understand the context of this conversation. Here's the relevant conversation history:

  {formatted_history}

  The user's latest query is: "{current_prompt}"

  Primary System Path: D:\Graduation_Project_Test_Environment
  Any analysis should consider that the user is working within a Windows environment.

  Analyze this conversation and determine:
  1. Is this a follow-up question that references something from the conversation history?
  2. Does it contain vague references (like "it", "that file", "the command", "this folder") that need clarification?
  3. Is it asking for more details about something previously discussed?
  4. Does it relate to the primary system path D:\Graduation_Project_Test_Environment?
  5. Does it refer to specific files, folders, or operations mentioned earlier?

  Examples of references requiring clarification:
  - "How do I delete it?" → What is "it" referring to?
  - "Can you show me that command again?" → Which command?
  - "What's inside this folder?" → Which folder?
  - "How do I fix the permissions?" → Which permissions?

  Based on your analysis, rewrite the query to be self-contained and include all relevant context.

  Instructions:
  - If the query directly references previous items, include their specific names/details
  - If asking about properties of something mentioned before, include what that thing is
  - If the query relates to file paths, ensure they're specified as Windows paths with backslashes
  - Make the query comprehensive but natural-sounding
  - Frame as a complete question that can stand on its own
  - Maintain the user's original intent and question type

  Format your response as ONLY the rewritten query, with no additional explanation.
